name: Fetch and Build Skia

on:
  workflow_dispatch:

jobs:
  skia:
    name: Fetch and build Skia
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip python3-venv ninja-build build-essential pkg-config zlib1g-dev libgtk-3-dev libglib2.0-dev

      - name: Clone depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git depot_tools
          echo "PATH=$(pwd)/depot_tools:$PATH" >> $GITHUB_ENV

      - name: Fetch Skia sources
        run: |
          fetch skia

      - name: Sync Skia dependencies
        run: |
          cd skia
          python tools/git-sync-deps

      - name: Generate Skia build files
        run: |
          cd skia
          gn gen out/Static --args='is_official_build=true skia_enable_tools=false skia_enable_gpu=false skia_use_system_zlib=true skia_use_system_expat=true'

      - name: Build Skia
        run: |
          cd skia
          ninja -C out/Static

      - name: Upload Skia artifact
        uses: actions/upload-artifact@v4
        with:
          name: skia-build
          path: skia/out/Static
